<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Unscheduled Rooms 25-26</title>
    <style>
      body { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; margin: 24px; background: #f3f5f8; color: #1d2330; }
      .container { max-width: 1180px; margin: 0 auto; }
      .card { background: #fff; border: 1px solid #dce2ea; border-radius: 12px; padding: 18px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04); }
      h1, h2, h3 { margin-top: 0; }
      .muted { color: #596173; font-size: 14px; }
      .error { color: #b00020; font-weight: 600; }
      .calendar-scroll {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-x: contain;
        margin: 0 -4px;
        padding: 2px 4px 6px;
      }
      .calendar { width: 100%; border-collapse: separate; border-spacing: 8px; table-layout: fixed; }
      .calendar th { text-align: left; color: #35405a; font-weight: 700; font-size: 14px; padding-bottom: 6px; }
      .calendar td { vertical-align: top; min-width: 160px; }
      .period-link { display: block; text-decoration: none; border: 1px solid #d3dcea; border-radius: 10px; padding: 10px; background: #f8fafd; color: #1d2330; transition: all 0.15s ease; }
      .period-link:hover { border-color: #9db5ea; background: #eef4ff; }
      .period-link.selected { border-color: #2457e0; background: #eaf0ff; box-shadow: inset 0 0 0 1px #2457e0; }
      .period-id { display: block; font-weight: 700; margin-bottom: 2px; }
      .period-time { display: block; font-size: 13px; color: #5e6880; }
      .empty-cell { display: block; color: #9aa4b5; text-align: center; padding-top: 14px; }
      .toggle-row { display: flex; flex-wrap: wrap; gap: 8px; }
      .toggle-btn { text-decoration: none; color: #2f3b53; border: 1px solid #cfd8e5; background: #f8fafd; border-radius: 999px; padding: 7px 12px; font-weight: 600; font-size: 14px; }
      .toggle-btn:hover { border-color: #9db5ea; background: #eef4ff; }
      .toggle-btn.selected { color: #153fba; border-color: #2457e0; background: #eaf0ff; }
      .text-link { color: #2457e0; text-decoration: none; font-weight: 600; }
      .text-link:hover { text-decoration: underline; }
      .unified-panel { padding-top: 14px; }
      .results-layout { display: grid; grid-template-columns: 280px 1fr; gap: 20px; }
      .filters-side { border-right: 1px solid #e5eaf1; padding-right: 16px; }
      .rooms-side { min-width: 0; min-height: 420px; }
      .control-stack { display: flex; flex-direction: column; gap: 14px; }
      .control-item { min-width: 0; }
      .control-label { display: block; font-size: 12px; font-weight: 700; color: #5b6478; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
      .control-value { display: inline-block; border: 1px solid #ccd5e1; border-radius: 999px; background: #f8fafd; padding: 7px 12px; font-weight: 700; }
      .panel-section { margin-top: 14px; padding-top: 14px; border-top: 1px solid #e5eaf1; }
      .panel-top { margin-top: 0; padding-top: 0; border-top: 0; }
      .meta-row { display: grid; grid-template-columns: 110px 130px 140px 120px 110px; gap: 10px; align-items: center; max-width: 100%; overflow-x: auto; }
      .meta-item { display: block; min-width: 0; font-size: 14px; color: #2c3651; white-space: nowrap; font-variant-numeric: tabular-nums; }
      .meta-label { color: #5b6478; font-weight: 700; margin-right: 6px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
      .floor-row { padding: 10px 0; border-top: 1px dashed #e5eaf1; }
      .floor-row:first-child { border-top: 0; padding-top: 0; }
      .floor-row h3 { margin-bottom: 8px; }
      .room-chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
      .room-chip { display: inline-block; border: 1px solid #ccd8eb; background: #f7faff; border-radius: 999px; padding: 5px 10px; font-weight: 600; font-size: 14px; color: #2c3651; }
      .room-chip-wrap { position: relative; display: inline-block; }
      .room-tooltip {
        display: none;
        position: absolute;
        z-index: 25;
        left: 0;
        top: calc(100% + 8px);
        min-width: 210px;
        max-width: 260px;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid #d5deed;
        background: #ffffff;
        color: #26314a;
        font-size: 12px;
        line-height: 1.35;
        box-shadow: 0 8px 20px rgba(20, 30, 50, 0.16);
        pointer-events: none;
      }
      .room-tooltip span { display: block; white-space: nowrap; }
      .room-chip-wrap:hover .room-tooltip { display: block; }
      @media (max-width: 960px) {
        .results-layout { grid-template-columns: 1fr; }
        .filters-side { border-right: 0; border-bottom: 1px solid #e5eaf1; padding-right: 0; padding-bottom: 14px; }
        .rooms-side { min-height: 0; }
        .meta-row { grid-template-columns: repeat(2, minmax(120px, 1fr)); overflow-x: visible; }
      }
      @media (max-width: 640px) {
        body { margin: 12px; }
        .card { padding: 14px; }
        .calendar-scroll {
          margin: 0 -10px;
          padding: 2px 10px 8px;
        }
        .calendar {
          width: 200%;
          border-spacing: 6px;
        }
        .calendar th,
        .calendar td {
          width: 20%;
          min-width: 0;
        }
        .calendar th { font-size: 13px; }
        .period-link { padding: 8px; border-radius: 8px; }
        .period-id { font-size: 14px; }
        .period-time { font-size: 12px; }
      }

    </style>

    <script>
(function () {
  const scheduleData = JSON.parse(document.getElementById("schedule-data").textContent);
  const blockData = JSON.parse(document.getElementById("block-data").textContent);

  function parseTimeToMinutes(value) {
    const parts = value.trim().split(":");
    if (parts.length !== 2) throw new Error("Invalid time '" + value + "'.");
    let hour = parseInt(parts[0], 10);
    const minute = parseInt(parts[1], 10);
    if (hour >= 1 && hour <= 6) hour += 12;
    return hour * 60 + minute;
  }

  function parseTimeRange(value) {
    const parts = value.split("-");
    if (parts.length !== 2) throw new Error("Invalid time range '" + value + "'.");
    const start = parseTimeToMinutes(parts[0]);
    const end = parseTimeToMinutes(parts[1]);
    if (end <= start) throw new Error("Invalid time range '" + value + "'.");
    return [start, end];
  }

  function rangesOverlap(aStart, aEnd, bStart, bEnd) {
    return aStart < bEnd && bStart < aEnd;
  }

  function qualifiersMatch(query, meetingValue) {
    if (query === null || query === undefined || query === "") return true;
    if (meetingValue === null || meetingValue === undefined) return true;
    return query === meetingValue;
  }

  function buildSlots(data) {
    const slots = {};
    const blockPeriods = data.block_periods;
    if (blockPeriods && typeof blockPeriods === "object") {
      for (const [periodId, payload] of Object.entries(blockPeriods)) {
        if (!payload || typeof payload !== "object") continue;
        const day = payload.day;
        const timeRange = payload.time;
        if (typeof day !== "string" || typeof timeRange !== "string") continue;
        const [startMin, endMin] = parseTimeRange(timeRange);
        slots["period:" + periodId] = {
          kind: "period",
          idOrKind: periodId,
          day,
          startMin,
          endMin,
        };
      }
    }
    const specialSessions = data.special_sessions;
    if (specialSessions && typeof specialSessions === "object") {
      for (const [kind, dayMap] of Object.entries(specialSessions)) {
        if (!dayMap || typeof dayMap !== "object") continue;
        for (const [day, payload] of Object.entries(dayMap)) {
          if (!payload || typeof payload !== "object") continue;
          const timeRange = payload.time;
          if (typeof timeRange !== "string") continue;
          const [startMin, endMin] = parseTimeRange(timeRange);
          slots["special:" + kind + ":" + day] = {
            kind: "special",
            idOrKind: kind,
            day,
            startMin,
            endMin,
          };
        }
      }
    }
    return slots;
  }

  function collectAllRooms(data) {
    const rooms = new Set();
    const sections = data.sections;
    if (!Array.isArray(sections)) return rooms;
    for (const section of sections) {
      if (!section || typeof section !== "object") continue;
      const meetings = section.meetings;
      if (!Array.isArray(meetings)) continue;
      for (const meeting of meetings) {
        if (!meeting || typeof meeting !== "object") continue;
        const room = meeting.room;
        if (typeof room === "string" && room.trim()) rooms.add(room.trim());
      }
    }
    return rooms;
  }

  function meetingSlots(meeting, slotsByKey) {
    const out = [];
    const periodIds = meeting.period_ids;
    if (Array.isArray(periodIds)) {
      for (const periodId of periodIds) {
        if (typeof periodId !== "string") continue;
        const slot = slotsByKey["period:" + periodId];
        if (slot) out.push(slot);
      }
    }
    const special = meeting.special_session;
    if (special && typeof special === "object") {
      const kind = special.kind;
      const day = special.day;
      if (typeof kind === "string" && typeof day === "string") {
        const slot = slotsByKey["special:" + kind + ":" + day];
        if (slot) out.push(slot);
      }
    }
    return out;
  }

  function findOccupiedRooms(data, slotsByKey, targetDay, targetStart, targetEnd, week, sem) {
    const occupied = new Set();
    const sections = data.sections;
    if (!Array.isArray(sections)) return occupied;
    for (const section of sections) {
      if (!section || typeof section !== "object") continue;
      const meetings = section.meetings;
      if (!Array.isArray(meetings)) continue;
      for (const meeting of meetings) {
        if (!meeting || typeof meeting !== "object") continue;
        const room = meeting.room;
        if (typeof room !== "string" || !room.trim()) continue;
        if (!qualifiersMatch(week, meeting.week)) continue;
        if (!qualifiersMatch(sem, meeting.sem)) continue;
        for (const slot of meetingSlots(meeting, slotsByKey)) {
          if (slot.day !== targetDay) continue;
          if (rangesOverlap(targetStart, targetEnd, slot.startMin, slot.endMin)) {
            occupied.add(room.trim());
            break;
          }
        }
      }
    }
    return occupied;
  }

  function queryUnusedRooms(data, block, period, week, sem) {
    const slotsByKey = buildSlots(block);
    const slot = slotsByKey["period:" + period];
    if (!slot) throw new Error("Unknown period '" + period + "'.");
    const allRooms = collectAllRooms(data);
    const occupied = findOccupiedRooms(
      data,
      slotsByKey,
      slot.day,
      slot.startMin,
      slot.endMin,
      week,
      sem

      totalRooms: allRooms.size,
      occupiedCount: occupied.size,

    const byFloor = {};

      const roomNumber = parseInt(room, 10);
      if (Number.isNaN(roomNumber)) {
        other.push(room);

      const floor = String(Math.floor((roomNumber / 100) % 10));
      if (!byFloor[floor]) byFloor[floor] = [];
      byFloor[floor].push(room);
    }
    const floorGroups = Object.keys(byFloor)

    const dayOrder = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];
    const dayToPeriods = data.schedule;
    const periodMeta = data.block_periods;
    if (!dayToPeriods || typeof dayToPeriods !== "object" || !periodMeta) {

          row.push(null);

          row.push(null);
          continue;
        }
        const meta = periodMeta[periodId] || {};
        const timeText = typeof meta.time === "string" ? meta.time : "";
        row.push({ period: periodId, time: timeText });
      }
      rows.push(row);

        sem1.length === 2 &&
        sem2.length === 2 &&
        sem1.includes("a") &&
        sem1.includes("b") &&
        sem2.includes("a") &&
        sem2.includes("b")
      ) {
        lines.push("All semesters: weeks A and B");
      } else if (JSON.stringify(sem1) === JSON.stringify(sem2)) {
        if (sem1.length === 0) {
          lines.push("No availability by semester/week");
        } else if (sem1.length === 1) {
          lines.push("All semesters: week " + sem1[0].toUpperCase() + " only");
        } else {
          lines.push("All semesters: weeks A and B");
        }
      } else {
        for (const sem of [1, 2]) {
          const weeksForSem = semToWeeks[sem];
          if (weeksForSem.length === 0) {
            lines.push("Sem " + sem + ": none");
          } else if (weeksForSem.length === 1) {
            lines.push("Sem " + sem + ": week " + weeksForSem[0].toUpperCase() + " only");
          } else {
            lines.push("Sem " + sem + ": weeks A and B");
          }
        }
      }
      details[room] = lines.join("\n");
    }
    return [availableRooms, details];
  }

  function buildResult(period, weekValue, semValue) {
    const query = queryUnusedRooms(scheduleData, blockData, period, weekValue, semValue);
    const [scopedRooms, roomDetails] = availabilityForScope(period, weekValue, semValue);
    const [floorGroups, otherRooms] = groupRoomsByFloor(scopedRooms);
    return {
      weekLabel: weekValue || "all",
      semLabel: semValue !== null && semValue !== undefined && semValue !== "" ? String(semValue) : "all",
      totalRooms: query.totalRooms,
      occupiedCount: query.totalRooms - scopedRooms.length,
      unusedCount: scopedRooms.length,
      floorGroups,
      otherRooms,
      roomDetails,
    };
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function buildQuery(params) {
    const parts = [];
    if (params.period) parts.push("period=" + encodeURIComponent(params.period));
    if (params.week) parts.push("week=" + encodeURIComponent(params.week));
    if (params.sem) parts.push("sem=" + encodeURIComponent(params.sem));
    const query = parts.join("&");
    return query ? "?" + query : "";
  }

  function renderCalendar(calendar, filters) {
    const header = calendar.days.map((day) => "<th>" + escapeHtml(day) + "</th>").join("");
    const body = calendar.rows
      .map((row) => {
        const cells = row
          .map((cell) => {
            if (!cell) return "<td><span class=\"empty-cell\">-</span></td>";
            const selected = filters.period === cell.period ? " selected" : "";
            const href =
              buildQuery({
                period: cell.period,
                week: filters.week,
                sem: filters.sem,
              }) + "#results";
            return (
              "<td><a class=\"period-link" +
              selected +
              "\" data-preserve-scroll=\"true\" href=\"" +
              href +
              "\"><span class=\"period-id\">" +
              escapeHtml(cell.period) +
              "</span><span class=\"period-time\">" +
              escapeHtml(cell.time) +
              "</span></a></td>"
            );
          })
          .join("");
        return "<tr>" + cells + "</tr>";
      })
      .join("");
    return (
      '<div class="calendar-scroll" aria-label="Weekly schedule — scroll horizontally for more days">' +
      '<table class="calendar"><thead><tr>' +
      header +
      "</tr></thead><tbody>" +
      body +
      "</tbody></table></div>"
    );
  }

  function renderToggleRow(label, name, options, filters) {
    const buttons = options
      .map(([value, text]) => {
        const selected = filters[name] === value ? " selected" : "";
        const href = buildQuery({
          period: filters.period,
          week: name === "week" ? value : filters.week,
          sem: name === "sem" ? value : filters.sem,
        });
        return (
          '<a class="toggle-btn' +
          selected +
          '" data-preserve-scroll="true" href="' +
          href +
          '">' +
          escapeHtml(text) +
          "</a>"
        );
      })
      .join("");
    return (
      '<div class="control-item">' +
      '<span class="control-label">' +
      escapeHtml(label) +
      "</span>" +
      '<div class="toggle-row">' +
      buttons +
      "</div></div>"
    );
  }

  function renderRoomChips(rooms, roomDetails) {
    return rooms
      .map((room) => {
        const lines = (roomDetails[room] || "").split("\n");
        const tooltip = lines
          .map((line) => "<span>" + escapeHtml(line) + "</span>")
          .join("");
        return (
          '<span class="room-chip-wrap">' +
          '<span class="room-chip">' +
          escapeHtml(room) +
          "</span>" +
          '<span class="room-tooltip">' +
          tooltip +
          "</span></span>"
        );
      })
      .join("");
  }

  function renderResults(filters, result, error) {
    if (!filters.period) return "";

    let errorHtml = error ? '<p class="error">' + escapeHtml(error) + "</p>" : "";
    let roomsHtml = "";
    if (result) {
      const floorRows = [...result.floorGroups]
        .reverse()
        .map(
          ([floor, rooms]) =>
            '<div class="floor-row"><h3>Floor ' +
            escapeHtml(floor) +
            "</h3>" +
            '<div class="room-chip-row">' +
            renderRoomChips(rooms, result.roomDetails) +
            "</div></div>"
        )
        .join("");

      let otherHtml = "";
      if (result.otherRooms.length > 0) {
        otherHtml =
          '<div class="floor-row"><h3>Other</h3>' +
          '<div class="room-chip-row">' +
          renderRoomChips(result.otherRooms, result.roomDetails) +
          "</div></div>";
      }

      roomsHtml =
        '<div class="panel-section panel-top">' +
        "<h2>Unscheduled Rooms</h2>" +
        '<div class="meta-row">' +
        '<span class="meta-item"><span class="meta-label">Week</span> ' +
        escapeHtml(result.weekLabel) +
        "</span>" +
        '<span class="meta-item"><span class="meta-label">Semester</span> ' +
        escapeHtml(result.semLabel) +
        "</span>" +
        '<span class="meta-item"><span class="meta-label">Total rooms</span> ' +
        escapeHtml(result.totalRooms) +
        "</span>" +
        '<span class="meta-item"><span class="meta-label">Occupied</span> ' +
        escapeHtml(result.occupiedCount) +
        "</span>" +
        '<span class="meta-item"><span class="meta-label">Unused</span> ' +
        escapeHtml(result.unusedCount) +
        "</span>" +
        "</div></div>" +
        '<div class="panel-section">' +
        floorRows +
        otherHtml +
        "</div>";
    }

    return (
      '<div id="results" class="card unified-panel">' +
      '<div class="results-layout">' +
      '<aside class="filters-side">' +
      "<h2>Filters</h2>" +
      '<div class="control-stack">' +
      '<div class="control-item period-pill">' +
      '<span class="control-label">Period</span>' +
      '<span class="control-value">' +
      escapeHtml(filters.period) +
      "</span></div>" +
      renderToggleRow("Week", "week", [
        ["", "All"],
        ["a", "A"],
        ["b", "B"],
      ], filters) +
      renderToggleRow("Semester", "sem", [
        ["", "All"],
        ["1", "1"],
        ["2", "2"],
      ], filters) +
      '<div class="control-item"><a class="text-link" href="./">Reset</a></div>' +
      "</div>" +
      errorHtml +
      "</aside>" +
      '<section class="rooms-side">' +
      roomsHtml +
      "</section></div></div>"
    );
  }

  function readFilters() {
    const params = new URLSearchParams(window.location.search);
    const period = (params.get("period") || "").trim();
    const weekRaw = (params.get("week") || "").trim().toLowerCase();
    const semRaw = (params.get("sem") || "").trim();
    const week = weekRaw === "a" || weekRaw === "b" ? weekRaw : "";
    const sem = semRaw === "1" || semRaw === "2" ? semRaw : "";
    const weekValue = week || null;
    const semValue = sem ? parseInt(sem, 10) : null;
    return { period, week, sem, weekValue, semValue };
  }

  function renderApp() {
    const filters = readFilters();
    const calendar = calendarView(blockData);
    let result = null;
    let error = null;

    if (filters.period) {
      try {
        result = buildResult(filters.period, filters.weekValue, filters.semValue);
      } catch (exc) {
        error = String(exc.message || exc);
      }
    }

    const app = document.getElementById("app");
    app.innerHTML =
      "<h1>Unscheduled Rooms 25-26</h1>" +
      '<p class="muted">Click a period in the weekly grid, then narrow by week or semester.</p>' +
      '<div class="card">' +
      renderCalendar(calendar, filters) +
      "</div>" +
      renderResults(filters, result, error);

    bindScrollPreservation();
    restoreScrollPosition();
  }

  function bindScrollPreservation() {
    const key = "roomFinderScrollY";
    document.querySelectorAll("a[data-preserve-scroll='true']").forEach((link) => {
      link.addEventListener("click", () => {
        sessionStorage.setItem(key, String(window.scrollY));
      });
    });
  }

  function restoreScrollPosition() {
    const key = "roomFinderScrollY";
    const saved = sessionStorage.getItem(key);
    if (saved !== null) {
      sessionStorage.removeItem(key);
      const y = Number(saved);
      if (!Number.isNaN(y)) window.scrollTo(0, y);
    }
  }

  renderApp();
})();

    </script>
  </body>
</html>
