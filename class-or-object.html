<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class or Object?</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --text: #111111;
    --muted: #999999;
    --border: #e5e5e5;
    --primary: #2563eb;
    --primary-light: #eff6ff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 24px 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  .logo {
    font-family: 'Fraunces', serif;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: var(--text);
  }

  .counter {
    font-size: 13px;
    color: var(--muted);
    font-weight: 500;
  }

  .progress-bar {
    height: 2px;
    background: var(--border);
  }
  .progress-fill {
    height: 100%;
    background: var(--primary);
    transition: width 0.4s ease;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
    gap: 48px;
  }

  .card {
    width: 100%;
    max-width: 580px;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 72px 48px;
    text-align: center;
    min-height: 260px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    transition: border-color 0.3s ease;
  }

  .card.revealed {
    border-color: var(--primary);
  }

  .word {
    font-family: 'Fraunces', serif;
    font-size: clamp(48px, 9vw, 82px);
    font-weight: 900;
    letter-spacing: -2px;
    line-height: 1;
    color: var(--text);
    animation: wordIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes wordIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .answer-section {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    animation: fadeIn 0.3s ease both;
  }
  .answer-section.visible { display: flex; }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  .answer-label {
    display: inline-block;
    background: var(--primary-light);
    color: var(--primary);
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 6px 16px;
    border-radius: 99px;
  }

  .explanation {
    font-size: 15px;
    color: var(--muted);
    line-height: 1.7;
    max-width: 400px;
  }

  .btn-row {
    display: flex;
    gap: 12px;
  }

  .btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    padding: 14px 36px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  .btn:hover {
    border-color: var(--primary);
    color: var(--primary);
  }

  .btn-primary {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }
  .btn-primary:hover {
    background: #1d4ed8;
    border-color: #1d4ed8;
    color: #fff;
  }

  .end-screen {
    display: none;
    flex: 1;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-align: center;
    padding: 48px 24px;
    animation: fadeIn 0.4s ease both;
  }
  .end-screen.visible { display: flex; }

  .end-title {
    font-family: 'Fraunces', serif;
    font-size: 56px;
    font-weight: 900;
    letter-spacing: -2px;
  }

  .end-sub {
    font-size: 15px;
    color: var(--muted);
    line-height: 1.65;
    margin-bottom: 8px;
  }

  @media (max-width: 500px) {
    header { padding: 20px 24px; }
    .card { padding: 48px 28px; }
    .btn-row { flex-direction: column; width: 100%; max-width: 300px; }
    .btn { text-align: center; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Class or Object?</div>
  <div class="counter" id="counter"></div>
</header>
<div class="progress-bar">
  <div class="progress-fill" id="progress-fill" style="width:0%"></div>
</div>

<main id="game-main">
  <div class="card" id="card">
    <div class="word" id="word-display"></div>
    <div class="answer-section" id="answer-section">
      <div class="answer-label" id="answer-label"></div>
      <div class="explanation" id="explanation"></div>
    </div>
  </div>

  <div class="btn-row" id="guess-btns">
    <button class="btn" onclick="reveal()">Class</button>
    <button class="btn" onclick="reveal()">Object</button>
  </div>

  <div class="btn-row" id="next-btn-row" style="display:none">
    <button class="btn btn-primary" onclick="nextCard()">Next</button>
  </div>
</main>

<div class="end-screen" id="end-screen">
  <div class="end-title">All done.</div>
  <div class="end-sub">Play again to shuffle the deck.</div>
  <button class="btn btn-primary" onclick="restart()">Play Again</button>
</div>

<script>
// ============================================================
//  EDIT YOUR CARDS HERE
//  Each card has:
//    word        -- the word shown on screen
//    answer      -- "class" or "object"
//    explanation -- shown after the answer is revealed
// ============================================================
const CARDS = [
  {
    word: "Dog",
    answer: "class",
    explanation: "Dog describes what any dog has in common: 4 legs, fur, a name, the ability to bark. No specific dog lives here."
  },
  {
    word: "Harper",
    answer: "object",
    explanation: "Harper is a specific dog. She is a German Shepherd, lives with Mr. Sharp, and loves her stuffed giraffe toy."
  },
  {
    word: "Car",
    answer: "class",
    explanation: "Car is the template: every car has wheels, an engine, and a speed. It is not a real car you can drive."
  },
  {
    word: "Toyota Camry #6BOR212",
    answer: "object",
    explanation: "This specific Toyoya Camry is gray, has 3800 miles on it, and license plate number #6BOR212. It is one real car."
  },
  {
    word: "BankAccount",
    answer: "class",
    explanation: "BankAccount defines the structure every account shares: a balance, an owner, and actions like deposit and withdraw."
  },
  {
    word: "Human",
    answer: "class",
    explanation: "Human describes what all humans have in common. It is the general blueprint, not any one person."
  },
  {
    word: "Calvin",
    answer: "object",
    explanation: "Calvin is a specific human. He has a particular height, age, and a lot of knowledge about Chainsaw Man."
  },
  {
    word: "Song",
    answer: "class",
    explanation: "Song defines what every song has: a title, an artist, and a duration."
  },
  {
    word: "Bohemian Rhapsody",
    answer: "object",
    explanation: "Bohemian Rhapsody is one specific song with its own title, artist, and runtime of 5 minutes 55 seconds."
  },
  {
    word: "Student",
    answer: "class",
    explanation: "Student is the blueprint: every student has a name, a grade, and a GPA."
  },
  {
    word: "Pizza",
    answer: "class",
    explanation: "Pizza defines the template: crust, sauce, toppings. The specific pepperoni pizza you ordered is the object."
  },
  {
    word: "Customer Order #88",
    answer: "object",
    explanation: "This is one real order placed at 6:42pm for a double-double with fries. It was created from the Order blueprint."
  }
];
// ============================================================

let current = 0;
let shuffled = [];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function loadCard() {
  const total = shuffled.length;
  document.getElementById('counter').textContent = `${current + 1} / ${total}`;
  document.getElementById('progress-fill').style.width = `${(current / total) * 100}%`;

  const wordEl = document.getElementById('word-display');
  wordEl.style.animation = 'none';
  wordEl.offsetHeight;
  wordEl.style.animation = '';
  wordEl.textContent = shuffled[current].word;

  document.getElementById('answer-section').classList.remove('visible');
  document.getElementById('card').classList.remove('revealed');
  document.getElementById('guess-btns').style.display = 'flex';
  document.getElementById('next-btn-row').style.display = 'none';
}

function reveal() {
  const card = shuffled[current];
  document.getElementById('answer-label').textContent = card.answer === 'class' ? 'Class' : 'Object';
  document.getElementById('explanation').textContent = card.explanation;
  document.getElementById('answer-section').classList.add('visible');
  document.getElementById('card').classList.add('revealed');
  document.getElementById('guess-btns').style.display = 'none';
  document.getElementById('next-btn-row').style.display = 'flex';
}

function nextCard() {
  current++;
  if (current >= shuffled.length) {
    document.getElementById('progress-fill').style.width = '100%';
    document.getElementById('game-main').style.display = 'none';
    document.getElementById('end-screen').classList.add('visible');
  } else {
    loadCard();
  }
}

function restart() {
  current = 0;
  shuffled = shuffle(CARDS);
  document.getElementById('end-screen').classList.remove('visible');
  document.getElementById('game-main').style.display = 'flex';
  loadCard();
}

shuffled = shuffle(CARDS);
loadCard();
</script>
</body>
</html>
